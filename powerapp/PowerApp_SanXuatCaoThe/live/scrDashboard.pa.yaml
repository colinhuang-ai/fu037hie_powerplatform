Screens:
  scrDashboard:
    Properties:
      Fill: =RGBA(242, 245, 249, 1)
      LoadingSpinner: =LoadingSpinner.None
      OnVisible: |
        =ClearCollect(
            colLoc,
            Filter(
                colSanXuat,
                (varThang = "Tất cả" || Text(Month('Ngày sản xuất')) = varThang) && (varThietBi = "Tất cả" || 'Thiết bị' = varThietBi)
            )
        );
        ClearCollect(
            colTB,
            Sort(
                AddColumns(
                    GroupBy(
                        AddColumns(colLoc, TenTB, 'Thiết bị', SoLuong, 'SL thực tế', SoLoiTB, 'SP lỗi'),
                        TenTB,
                        grp
                    ),
                    SanLuong, Sum(grp, SoLuong),
                    SoLoi, Sum(grp, SoLoiTB)
                ),
                SanLuong,
                SortOrder.Descending
            )
        );
        ClearCollect(
            colThang,
            Sort(
                AddColumns(
                    GroupBy(
                        AddColumns(colLoc, ThangSo, Month('Ngày sản xuất'), SoLuong, 'SL thực tế'),
                        ThangSo,
                        grp
                    ),
                    SanLuong, Sum(grp, SoLuong)
                ),
                ThangSo,
                SortOrder.Ascending
            )
        )
    Children:
      - dbHeaderBar:
          Control: Rectangle
          Properties:
            Fill: =RGBA(11, 60, 109, 1)
            Height: =64
            Width: =1366
            X: =0
            Y: =0
      - dbTitle:
          Control: Label
          Properties:
            Align: =Align.Left
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =26
            Size: =17
            Text: ="DASHBOARD SẢN XUẤT THIẾT BỊ ĐIỆN CAO THẾ"
            VerticalAlign: =VerticalAlign.Middle
            Width: =760
            Wrap: =false
            X: =24
            Y: =10
      - dbSubTitle:
          Control: Label
          Properties:
            Align: =Align.Left
            Color: =RGBA(178, 205, 228, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Normal
            Height: =20
            Size: =11
            Text: ="KPI sản lượng - giờ công - chất lượng  |  Cơ sở dữ liệu Dataverse"
            VerticalAlign: =VerticalAlign.Middle
            Width: =760
            Wrap: =false
            X: =24
            Y: =34
      - dbBtnNhap:
          Control: Classic/Button
          Properties:
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(0, 158, 204, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =32
            HoverColor: =Self.Color
            HoverFill: =ColorFade(Self.Fill, -15%)
