      - btnLuu:
          Control: Classic/Button
          Properties:
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(22, 148, 84, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =38
            HoverColor: =Self.Color
            HoverFill: =ColorFade(Self.Fill, -15%)
            OnSelect: |
              =If(
                  IsBlank(dpNgay.SelectedDate) || IsBlank(ddFThietBi.Selected.Value) || IsBlank(ddFDayChuyen.Selected.Value) || IsBlank(txtThucTe.Text),
                  Notify("Vui lòng nhập đầy đủ Ngày, Thiết bị, Dây chuyền và SL thực tế.", NotificationType.Error),
                  Patch(
                      'Sản xuất cao thế',
                      If(varLaMoi, Defaults('Sản xuất cao thế'), varBanGhi),
                      {
                          'Mã bản ghi': "SX-" & Text(dpNgay.SelectedDate, "yyyymmdd") & "-" & ddFDayChuyen.Selected.Value,
                          'Ngày sản xuất': dpNgay.SelectedDate,
                          'Thiết bị': ddFThietBi.Selected.Value,
                          'Cấp điện áp': Coalesce(Value(ddFDienAp.Selected.Value), 0),
                          'Dây chuyền': ddFDayChuyen.Selected.Value,
                          'SL kế hoạch': Coalesce(Value(txtKeHoach.Text), 0),
                          'SL thực tế': Coalesce(Value(txtThucTe.Text), 0),
                          'SP lỗi': Coalesce(Value(txtLoi.Text), 0),
                          'SP đạt': Max(Coalesce(Value(txtThucTe.Text), 0) - Coalesce(Value(txtLoi.Text), 0), 0),
                          'Giờ vận hành': Coalesce(Value(txtVanHanh.Text), 0),
                          'Giờ dừng máy': Coalesce(Value(txtDungMay.Text), 0),
                          'Điện năng': Coalesce(Value(txtDienNang.Text), 0),
                          'Giờ công': Coalesce(Value(txtGioCong.Text), 0),
                          'Hoàn thành KH': IfError(Value(txtThucTe.Text) / Value(txtKeHoach.Text), 0),
                          'Tỷ lệ lỗi': IfError(Value(txtLoi.Text) / Value(txtThucTe.Text), 0),
                          'Năng suất': IfError(Value(txtThucTe.Text) / Value(txtVanHanh.Text), 0),
                          'Trạng thái': Coalesce(ddFTrangThai.Selected.Value, "Đạt"),
                          'Ghi chú': txtGhiChu.Text
                      }
                  );
                  If(
                      IsEmpty(Errors('Sản xuất cao thế')),
                      Notify("Đã lưu bản ghi sản xuất thành công.", NotificationType.Success);
                      ClearCollect(colSanXuat, 'Sản xuất cao thế');
                  ClearCollect(
                      colLoc,
                      Filter(
                          colSanXuat,
                          (varThang = "Tất cả" || Text(Month('Ngày sản xuất')) = varThang) && (varThietBi = "Tất cả" || 'Thiết bị' = varThietBi)
                      )
                  );
                  ClearCollect(
                      colTB,
                      Sort(
                          AddColumns(
                              GroupBy(
                                  AddColumns(colLoc, TenTB, 'Thiết bị', SoLuong, 'SL thực tế', SoLoiTB, 'SP lỗi'),
                                  TenTB,
                                  grp
                              ),
                              SanLuong, Sum(grp, SoLuong),
                              SoLoi, Sum(grp, SoLoiTB)
                          ),
                          SanLuong,
                          SortOrder.Descending
                      )
                  );
                  ClearCollect(
                      colThang,
                      Sort(
                          AddColumns(
                              GroupBy(
                                  AddColumns(colLoc, ThangSo, Month('Ngày sản xuất'), SoLuong, 'SL thực tế'),
                                  ThangSo,
                                  grp
                              ),
                              SanLuong, Sum(grp, SoLuong)
                          ),
                          ThangSo,
                          SortOrder.Ascending
                      )
                  );
                      Set(varLaMoi, true);
                      Set(varBanGhi, Defaults('Sản xuất cao thế'));
                      Set(varReset, !varReset),
                      Notify("Lưu thất bại - " & First(Errors('Sản xuất cao thế')).Message, NotificationType.Error)
                  )
              )
            PressedColor: =Self.Color
            PressedFill: =ColorFade(Self.Fill, -25%)
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =13
            Text: ="Lưu bản ghi"
            Width: =190
            X: =650
            Y: =620
