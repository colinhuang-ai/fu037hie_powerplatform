Screens:
  Screen1:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      OnVisible: |-
        =Set(gblHomeConfirm, false);
        Set(gblCancelConfirm, false)
    Children:
      - SiteRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            Width: =Parent.Width
          Children:
            - SiteHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(0, 0, 0, 1)
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingLeft: =16
                  PaddingRight: =16
                  Width: =Parent.Width
                Children:
                  - SiteHeaderHome:
                      Control: Classic/Icon
                      Properties:
                        AccessibleLabel: ="Về màn hình đầu"
                        AlignInContainer: =AlignInContainer.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =44
                        Icon: =Icon.Home
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =If(
                              CountRows(colChecklist) > 0 && !gblHomeConfirm,
                              Set(gblHomeConfirm, true);
                              Notify("Nhấn biểu tượng nhà lần nữa để huỷ phiên kiểm tra.", NotificationType.Warning, 4000),
                              Clear(colChecklist);
                              Set(gblHomeConfirm, false);
                              Navigate(Screen1, ScreenTransition.Fade)
                          )
                        PaddingBottom: =10
                        PaddingLeft: =10
                        PaddingRight: =10
                        PaddingTop: =10
                        TabIndex: =0
                        Tooltip: ="Về màn hình đầu"
                        Width: =44
                  - SiteHeaderTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Site Inspection"
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Center
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        FontWeight: =FontWeight.Semibold
                        Height: =28
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =17
                        Text: ="Site Inspection"
                        Wrap: =false
                  - SiteHeaderAvatar:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Fill: =RGBA(240, 214, 138, 1)
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =22
                        RadiusBottomRight: =22
                        RadiusTopLeft: =22
                        RadiusTopRight: =22
                        Width: =44
                      Children:
                        - SiteHeaderInitials:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =AppUserName
                              Align: =Align.Center
                              AlignInContainer: =AlignInContainer.Center
                              Color: =RGBA(32, 31, 30, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =20
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: =AppUserInitials
                              Width: =40
                              Wrap: =false
            - SiteBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =568
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =14
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  Width: =Parent.Width
                Children:
                  - SiteZoneImageBox:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(233, 234, 236, 1)
                        FillPortions: =0
                        Height: =150
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width
                      Children:
                        - SiteZonePlaceholder:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Chưa có sơ đồ khu vực"
                              Align: =Align.Center
                              AlignInContainer: =AlignInContainer.Center
                              Color: =RGBA(120, 120, 125, 1)
                              Height: =20
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =13
                              Text: ="Chưa có sơ đồ khu vực"
                              Width: =220
                              Wrap: =false
                  - SiteFldZone:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =66
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =6
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width
                      Children:
                        - SiteLblZone:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Tên khu vực"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(120, 120, 125, 1)
                              Height: =16
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: ="Tên khu vực"
                              Wrap: =false
                        - SiteDdZone:
                            Control: ModernDropdown
                            Properties:
                              AccessibleLabel: ="Chọn khu vực sản xuất"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(32, 31, 30, 1)
                              Height: =44
                              ItemDisplayText: =ThisItem.Title
                              Items: =Sort(colZones, Title, SortOrder.Ascending)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnChange: =Set(gblZone, SiteDdZone.Selected)
                              Size: =14
                              Width: =Parent.Width
                  - SiteFldAddress:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =66
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =6
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width
                      Children:
                        - SiteLblAddress:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Địa chỉ"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(120, 120, 125, 1)
                              Height: =16
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: ="Địa chỉ"
                              Wrap: =false
                        - SiteAddressBox:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(214, 214, 214, 1)
                              BorderThickness: =1
                              Fill: =RGBA(242, 242, 242, 1)
                              FillPortions: =0
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =10
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =10
                              Width: =Parent.Width
                            Children:
                              - SiteTxtAddress:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="Địa chỉ khu vực đã chọn"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(32, 31, 30, 1)
                                    Height: =24
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =14
                                    Text: =Coalesce(SiteDdZone.Selected.Address, "—")
                                    Wrap: =false
                  - SiteFldDesc:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =132
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =6
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width
                      Children:
                        - SiteLblDesc:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Mô tả khu vực"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(120, 120, 125, 1)
                              Height: =16
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: ="Mô tả khu vực"
                              Wrap: =false
                        - SiteDescBox:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(214, 214, 214, 1)
                              BorderThickness: =1
                              Fill: =RGBA(242, 242, 242, 1)
                              FillPortions: =0
                              Height: =110
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =10
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =10
                              Width: =Parent.Width
                            Children:
                              - SiteTxtDesc:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="Mô tả khu vực đã chọn"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(32, 31, 30, 1)
                                    Height: =90
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =14
                                    Text: =Coalesce(SiteDdZone.Selected.Description, "Chưa có mô tả cho khu vực này.")
                                    VerticalAlign: =VerticalAlign.Top
                  - SiteFldTemplate:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =66
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =6
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width
                      Children:
                        - SiteLblTemplate:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Bộ tiêu chuẩn kiểm tra"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(120, 120, 125, 1)
                              Height: =16
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: ="Bộ tiêu chuẩn kiểm tra"
                              Wrap: =false
                        - SiteDdTemplate:
                            Control: ModernDropdown
                            Properties:
                              AccessibleLabel: ="Chọn bộ tiêu chuẩn kiểm tra"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(32, 31, 30, 1)
                              Height: =44
                              ItemDisplayText: =ThisItem.Title
                              Items: =Sort(colTemplates, Title, SortOrder.Ascending)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnChange: =Set(gblTemplate, SiteDdTemplate.Selected)
                              Size: =14
                              Width: =Parent.Width
            - SiteFooterRule:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(214, 214, 214, 1)
                  FillPortions: =0
                  Height: =1
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Width: =Parent.Width
            - SiteFooter:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =76
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =20
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =12
                  Width: =Parent.Width
                Children:
                  - SiteBtnCancel:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Huỷ lựa chọn"
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Secondary
                        Color: =RGBA(32, 31, 30, 1)
                        Height: =44
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Reset(SiteDdZone);
                          Reset(SiteDdTemplate);
                          Clear(colChecklist);
                          Notify("Đã xoá lựa chọn khu vực và bộ tiêu chuẩn.", NotificationType.Information, 2000)
                        Size: =14
                        Text: ="Huỷ"
                        Width: =110
                  - SiteBtnSurvey:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Bắt đầu khảo sát"
                        AlignInContainer: =AlignInContainer.Center
                        BasePaletteColor: |-
                          =If(
                              IsBlank(SiteDdZone.Selected.Title) || IsBlank(SiteDdTemplate.Selected.Title),
                              RGBA(200, 203, 206, 1),
                              RGBA(60, 74, 82, 1)
                          )
                        Color: =RGBA(255, 255, 255, 1)
                        DisplayMode: |-
                          =If(
                              IsBlank(SiteDdZone.Selected.Title) || IsBlank(SiteDdTemplate.Selected.Title),
                              DisplayMode.Disabled,
                              DisplayMode.Edit
                          )
                        Height: =44
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Set(gblZone, SiteDdZone.Selected);
                          Set(gblTemplate, SiteDdTemplate.Selected);
                          ClearCollect(
                              colChecklist,
                              ForAll(
                                  Sort(
                                      Filter(colItems, TemplateId = SiteDdTemplate.Selected.TemplateId),
                                      OrderNumber,
                                      SortOrder.Ascending
                                  ) As it,
                                  {
                                      ItemId: it.ItemId,
                                      OrderNumber: it.OrderNumber,
                                      Question: it.Question,
                                      IsCritical: it.IsCritical,
                                      Result: "",
                                      FailDesc: "",
                                      FailSeverity: "",
                                      FailAssigneeName: "",
                                      FailAssigneeEmail: "",
                                      FailPhoto: ""
                                  }
                              )
                          );
                          Set(gblCurrentItemId, 0);
                          Set(gblShowFailPanel, false);
                          Set(gblShowCamera, false);
                          Navigate(scrChecklist, ScreenTransition.Fade)
                        Size: =14
                        Text: ="Khảo sát ›"
                        Width: =140
